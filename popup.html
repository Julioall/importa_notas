<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ferramentas Educacionais</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="suite">
    <header class="suite__header">
      <div><h1>Ferramentas Educacionais</h1><p>Recursos para Moodle, Drive e Kahoot</p></div>
    </header>

    <section><h2>Recursos ativos</h2>
      <button class="tool" data-action="moodle"><span class="tool__icon">M</span><span><strong>Ferramentas Moodle</strong><small>Notas, relatórios, pendências e downloads</small></span><span class="chevron">›</span></button>
      <button class="tool" data-action="drive-pdf"><span class="tool__icon blue">PDF</span><span><strong>Baixar PDF</strong><small>Preparar páginas do Google Drive para PDF</small></span><span class="chevron">›</span></button>
      <button class="tool" data-action="kahoot"><span class="tool__icon purple">K</span><span><strong>KahootOmático</strong><small>Importar perguntas por CSV no editor</small></span><span class="chevron">›</span></button>
    </section>

    <section><h2>Comportamento</h2>
      <label class="setting"><span><strong>Pendências nos cursos</strong><small>Consultar e exibir indicadores no Moodle</small></span><input type="checkbox" data-setting="coursePendingChecks"></label>
      <label class="setting"><span><strong>Pendências nas categorias</strong><small>Consolidar os cursos exibidos</small></span><input type="checkbox" data-setting="categoryPendingChecks"></label>
      <label class="setting"><span><strong>Indicadores visuais</strong><small>Mostrar etiquetas de situação</small></span><input type="checkbox" data-setting="pendingBadges"></label>
      <label class="setting"><span><strong>Baixar pendentes</strong><small>Habilitar downloads em lote</small></span><input type="checkbox" data-setting="pendingDownloads"></label>
    </section>

    <footer><button id="save-settings">Salvar configurações</button><p id="status" role="status">Carregando…</p></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
